<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 text-white min-h-screen p-4 flex flex-col justify-between" style="background-color: #6600FF;">
      <div>
        <h2 class="text-2xl font-bold text-center">Dashboard</h2>
        <ul class="mt-6 space-y-4">
          <li class="flex items-center space-x-2 cursor-pointer">
            <i class="mr-2"></i>
            <span><a href="{{ url_for('user')}}">Users</a></span>
          </li>
          <li class="flex items-center space-x-2 cursor-pointer">
            <i class="mr-2"></i>
            <span><a href="{{ url_for('enhance')}}">Image Enhancer</a></span>
          </li>
          <li class="flex items-center space-x-2 cursor-pointer">
            <i class="mr-2"></i>
            <span><a href="{{ url_for('change')}}">Background Changer</a></span>
          </li>
          <li class="flex items-center space-x-2 cursor-pointer">
            <i class="mr-2"></i>
            <span><a href="{{ url_for('background')}}">Background Remover</a></span>
          </li>
        </ul>
      </div>

      <!-- Logout Button -->
      <form  >
        <button id="remove-btn"   class="flex items-center space-x-2 p-2 bg-red-500 rounded-lg w-full">
          <i class="mr-2"></i>
          <span >Logout</span>
        </button>
        <script>
          document.getElementById("remove-btn").addEventListener("click", function () {
window.location.href = "{{ url_for('index') }}";
});
      </script>
      </form>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Admin Dashboard</h1>
        <div class="text-2xl font-bold">LOGO</div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- User Analytics -->
        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title flex items-center"><i class="mr-2"></i> Users</h2>
          </div>
          <div class="card-content">
            <p class="text-xl font-bold">1,250</p>
            <a href="db-user.html">
              <button class="mt-2 w-full bg-blue-500 text-white py-2 px-4 rounded" style="background-color: #6600FF;">View</button>
            </a>
          </div>
        </div>

        <!-- Image Enhancer Stats -->
        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title flex items-center"><i class="mr-2"></i> Image Enhancer</h2>
          </div>
          <div class="card-content">
            <p class="text-xl font-bold">7,500</p>
            <a href="db-en.html">
              <button class="mt-2 w-full bg-blue-500 text-white py-2 px-4 rounded" style="background-color: #6600FF;">View</button>
            </a>
          </div>
        </div>

        <!-- Background Changer Stats -->
        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title flex items-center"><i class="mr-2"></i> Background Changer</h2>
          </div>
          <div class="card-content">
            <p class="text-xl font-bold">5,000</p>
            <a href="db-bc.html">
              <button class="mt-2 w-full bg-blue-500 text-white py-2 px-4 rounded" style="background-color: #6600FF;">View</button>
            </a>
          </div>
        </div>

        <!-- Background Remover Stats -->
        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title flex items-center"><i class="mr-2"></i> Background Remover</h2>
          </div>
          <div class="card-content">
            <p class="text-xl font-bold">3,200</p>
            <a href="db-br.html">
              <button class="mt-2 w-full bg-blue-500 text-white py-2 px-4 rounded" style="background-color: #6600FF;">View</button>
            </a>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title">User Growth</h2>
          </div>
          <div class="card-content">
            <canvas id="userGrowthChart"></canvas>
          </div>
        </div>

        <div class="card bg-white p-4 rounded-lg shadow">
          <div class="card-header">
            <h2 class="card-title">Image Processing Trend</h2>
          </div>
          <div class="card-content">
            <canvas id="imageProcessingChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart.js Script -->
  <script>
    const userData = [
      { name: "Jan", users: 5 },
      { name: "Feb", users: 10 },
      { name: "Mar", users: 15 },
      { name: "Apr", users: 20 },
      { name: "May", users: 30 },
      { name: "Jun", users: 50 },
      { name: "Jul", users: 70 },
    ];

    const imageData = [
      { name: "Jan", images: 100 },
      { name: "Feb", images: 250 },
      { name: "Mar", images: 400 },
      { name: "Apr", images: 600 },
      { name: "May", images: 900 },
      { name: "Jun", images: 1200 },
    ];

    const ctx1 = document.getElementById('userGrowthChart').getContext('2d');
    const userGrowthChart = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: userData.map(data => data.name),
        datasets: [{
          label: 'Users',
          data: userData.map(data => data.users),
          borderColor: '#6600FF',
          borderWidth: 2,
          fill: false
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { beginAtZero: true },
          y: { beginAtZero: true }
        }
      }
    });

    const ctx2 = document.getElementById('imageProcessingChart').getContext('2d');
    const imageProcessingChart = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: imageData.map(data => data.name),
        datasets: [{
          label: 'Images',
          data: imageData.map(data => data.images),
          backgroundColor: '#6600FF'
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { beginAtZero: true },
          y: { beginAtZero: true }
        }
      }
    });
  </script>
</body>

</html>
